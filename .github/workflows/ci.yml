name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal CI: only checks that affect this project's build, deploy, and
# startup path (AGENTS.md 规则 4). It does not run business-feature
# acceptance tests, API/permission scenario verification, or any
# comprehensive functional acceptance — those remain the user's job after
# release, per AGENTS.md 规则 4 and docs/规范/验证与发布.md
# "发布检查与功能验收分工".
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Lint (baseline-gated)
        # Full-repo `npm run lint` currently has 56 pre-existing errors / 171
        # warnings spread across app/, tests/, and tools/ (not confined to
        # tools/ as originally assumed — verified 2026-10-28 against
        # origin/main @ eee72b72 via two independent counting methods).
        # Fixing them is out of scope here, and the eslint exit code alone
        # can't distinguish "no new errors" from "still has old errors", so
        # this step compares a structured (JSON, not regex-on-text) count
        # against a committed baseline and only fails on regression. See
        # .github/workflows/check-lint-baseline.mjs for the full rationale,
        # including the 2026-10-25 incident this is designed to avoid
        # (a stylish-output regex anchored on a column number, silently
        # disabling the gate).
        run: node .github/workflows/check-lint-baseline.mjs

      - name: Read document path literals exist
        # Static filesystem check (no DB, no runtime): fails if code reads a
        # Markdown file that does not exist. docs/规范/文档管理.md:29 already
        # requires updating 代码中的文档路径字面量 when a document moves, but
        # nothing read that requirement — f5da8fb3 wrote the rule and broke it
        # in the same 472-file tidy-up, leaving
        # backend/ai_assistant/test_business_promotion_budget_v11_limited_identity_blocker.py:45
        # pointing at a renamed design doc and ERRORing ever since. This step
        # is that rule's reader. Zero tolerance (no baseline count): the only
        # real dead reference is fixed, so the honest floor is 0, and genuine
        # exceptions go in the script's dated EXEMPTIONS allowlist instead.
        # Scope is deliberately narrow — see the script header for the measured
        # effect of each of its three noise filters (1238 -> 26 -> 3 -> 1
        # against origin/main @ 142becaf). Guards a documentation contract, not
        # business behavior. node exits with the script's own status, so this
        # step's pass/fail is the gate's verdict directly.
        run: node .github/workflows/check-doc-path-literals.mjs

      - name: Gate's own unit tests (document path literals)
        # The gate itself must be tested, or it shares the fate of the prose
        # rule it enforces: able to stop finding anything with nobody noticing.
        # Covers the real dead reference's two-line literal shape, each of the
        # three noise filters, non-UTF-8 files being skipped rather than
        # decoded into mojibake findings, and the gate's one self-exclusion
        # still naming an existing file.
        run: node --test --test-timeout=30000 tests/doc-path-literal-gate.test.mjs

      - name: Frozen policy caller and installer source checks
        run: python -B .github/workflows/check-reviewed-policy.py

      - name: Frozen catalog OWNER privileges
        # Source-only data check; no runtime/PrepareApp hook or database.
        run: |
          python -B tests/catalog-baselines.py
          python -B tools/check_catalog_baselines.py

      - name: Lifecycle controller qualification bytes
        # Static source-byte check only. A controller change must be reviewed
        # and qualified before it can reach a maintenance window.
        run: node --test --test-timeout=30000 tests/maintenance-controller-qualification.test.mjs

      - name: Schema addition enumeration consistency
        # Structural-migration generation lists are hand-copied into several
        # files; a missed copy only surfaces at release time. Read-only source
        # text check: no runtime, database, artifact or lifecycle access.
        run: node --test --test-timeout=30000 tests/schema-addition-enumeration-consistency.test.mjs

      - name: Current Ai158 schema recipe source bindings
        # Explicit current recipe only. Historical rehearsal recipes are not
        # silently renewed. Import the real inherited gate; never bind a parent,
        # access a database/runtime, prepare artifacts, or run lifecycle actions.
        # Private venv, with the psycopg pin read from repository requirements.
        timeout-minutes: 5
        run: |
          python -m venv .runtime/schema-digest-ci
          .runtime/schema-digest-ci/bin/python -c "from pathlib import Path; import subprocess, sys; pins = [s.strip() for s in Path('backend/requirements.txt').read_text().splitlines() if s.strip().startswith('psycopg[binary]==')]; assert len(pins) == 1, 'Expected one exact psycopg pin'; subprocess.run([sys.executable, '-m', 'pip', 'install', pins[0]], check=True)"
          .runtime/schema-digest-ci/bin/python -B tests/schema-code-digest-static.py
          .runtime/schema-digest-ci/bin/python -B tools/check_schema_code_digest.py --recipe config/main-schema-releases/ai-0090.json

      - name: Build (includes type checking)
        # tsconfig.json has strict: true and noEmit: true; `vinext build`
        # performs TypeScript compilation as part of the build, so this
        # step covers both the production build and type checking. There is
        # no separate `tsc` script in package.json to run independently.
        run: npm run build

      - name: Unit tests (curated subset)
        # NOT `npm run test:unit` (that glob is tests/*.test.ts, 494 files).
        # Running the full glob blind was explicitly out of scope: it has
        # known pre-existing failures (tests/market-annotation.test.ts,
        # stale source-text regex assertions) and at least one file that
        # has hung for 20+ minutes in a full-suite run despite passing in
        # under 3s standalone (tests/customer-service-store-selection-interaction.test.ts),
        # which would make CI hang indefinitely rather than fail.
        #
        # Instead this runs a small, explicitly verified allowlist (listed
        # in .github/workflows/ci-unit-test-files.txt) covering general
        # sanity plus the two riskiest recent fixes (CSRF same-origin gate,
        # Excel parse size boundaries). --test-timeout is also set as a
        # hang safety net: a hung test fails after 30s instead of hanging
        # the job. The job-level timeout-minutes below is the second line
        # of defense.
        timeout-minutes: 5
        run: |
          node --import tsx --test --test-timeout=30000 $(grep -v '^#' .github/workflows/ci-unit-test-files.txt | grep -v '^\s*$')

      - name: Backend production boundary audit
        # Static import-boundary audit (no DB, no running backend): fails if
        # a frontend/tool module reaches into Django production internals it
        # isn't allowed to import. Guards a build-time contract, not
        # business behavior.
        run: npm run check:backend-boundary

      - name: Pi152 ACL catalog contract
        # Static AST check (no DB, no Django import): fails if the ACL
        # catalog's granted permissions drift from what the migration
        # declares as append-only. Guards a code-level contract that
        # previously regressed silently (see script docstring), not
        # business behavior.
        run: npm run check:pi152-acl

      - name: AI writer privilege coverage
        # Static AST check (no DB, no Django import): fails if an ORM write
        # call (.objects...delete()/.update()) in backend/ai_assistant/
        # needs a privilege database_contract.WRITER_PRIVILEGES does not
        # grant on that table. Guards the 2026-10-28 incident where
        # ai_write_request_receipts was missing DELETE (see script
        # docstring for scope and honest limitations), not business
        # behavior.
        # Invoked directly rather than through an npm script: package.json is
        # a guard-protected Worker entrypoint, so adding a script entry to it
        # breaks the release chain's byte-exact check. That is what stopped the
        # Worker on 2026-10-31 at the next reboot.
        run: python tests/ai-writer-privilege-coverage.py
