<html lang="zh-CN">
<head>

<title>净水器开水器细分演示</title>
<style>
  :root { --bg:#f4f7fb; --panel:#fff; --border:#e1e8f1; --text:#26364d; --soft-text:#52637a; --muted:#8592a5; --brand:#3f7be0; --brand-soft:#eef4fe; --brand-border:#b9cff4; --green:#1f9d6b; --orange:#c97a2c; --red:#d64550; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--text); font:13px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; }
  .banner { margin-bottom:12px; padding:8px 12px; border:1px dashed var(--orange); border-radius:8px; color:var(--orange); background:#fff8ef; font-size:12px; }
  .page-tabs { display:flex; gap:6px; margin-bottom:14px; padding:5px; border:1px solid var(--border); border-radius:10px; background:#fff; width:max-content; max-width:100%; flex-wrap:wrap; }
  .page-tabs button { padding:7px 14px; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--soft-text); font:inherit; font-weight:700; cursor:pointer; }
  .page-tabs button.active { background:var(--brand); color:#fff; }
  .crumb { margin:0 0 10px; color:var(--muted); font-size:12px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; margin-bottom:14px; }
  .overview { display:grid; grid-template-columns:1.2fr 1.8fr; gap:16px; padding:18px; }
  .eyebrow { color:var(--brand); font-size:11px; font-weight:700; letter-spacing:.06em; }
  h2 { margin:2px 0 6px; font-size:17px; }
  .overview p, .toolbar p { margin:0; color:var(--muted); font-size:12px; }
  .cards { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  .cards article { padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#fbfcfe; }
  .cards span { display:block; color:var(--muted); font-size:11px; }
  .cards strong { display:block; font-size:18px; }
  .cards small { color:var(--muted); font-size:10px; }
  .cards article.warning { border-color:#f1d9b5; background:#fff8ef; }
  .toolbar { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--border); }
  .toolbar h2 { font-size:15px; margin:0; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  .field { display:grid; gap:4px; color:var(--soft-text); font-size:11px; font-weight:700; }
  .field select, .field input { height:34px; min-width:130px; padding:0 10px; border:1px solid var(--border); border-radius:7px; background:#fff; color:var(--soft-text); font:inherit; font-size:12px; }
  .field input[type=search] { width:220px; }

  .ss { position:relative; min-width:200px; }
  .ss-trigger { width:100%; height:34px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 10px; border:1px solid var(--border); border-radius:7px; background:#fff; color:var(--soft-text); font:inherit; font-size:12px; text-align:left; cursor:pointer; }
  .ss-trigger span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ss.open .ss-trigger { border-color:var(--brand-border); box-shadow:0 0 0 2px #edf3ff; }
  .ss-menu { position:absolute; z-index:50; top:calc(100% + 5px); left:0; width:max(100%,340px); max-width:calc(100vw - 32px); max-height:300px; overflow:auto; padding:6px; border:1px solid var(--border); border-radius:9px; background:#fff; box-shadow:0 14px 32px rgba(28,45,75,.2); }
  .ss-search { display:flex; align-items:center; gap:6px; margin-bottom:4px; padding:0 8px; border:1px solid var(--border); border-radius:6px; }

  .ss-opt { width:100%; display:flex; justify-content:space-between; gap:8px; padding:6px 8px; border:0; border-radius:6px; background:none; color:var(--text); font:inherit; font-size:12px; text-align:left; cursor:pointer; }

  .ss-opt.selected { color:var(--brand); font-weight:700; background:var(--brand-soft); }
  .ss-opt.group { font-weight:700; color:var(--soft-text); }
  .ss-empty { padding:8px; color:var(--muted); font-size:12px; }
  .table-wrap { overflow-x:auto; }
  .table-wrap.editing { padding-bottom:300px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:9px 12px; border-top:1px solid var(--border); text-align:left; white-space:nowrap; vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:12px; background:#fafcfe; }
  td.name { white-space:normal; min-width:240px; max-width:340px; }
  td.num, th.num { text-align:right; }
  .tag { display:inline-flex; padding:3px 8px; border:1px solid var(--brand-border); border-radius:6px; color:var(--brand); background:var(--brand-soft); font-weight:700; font-size:12px; }

  .status { display:inline-flex; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .status.ok { color:var(--green); background:#edf9f2; } .status.warn { color:var(--orange); background:#fff4e6; }
  .cell-note { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
  .btn { height:30px; padding:0 10px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--soft-text); font:inherit; font-size:12px; cursor:pointer; }
  .btn.primary { border-color:var(--brand); background:var(--brand); color:#fff; }
  .btn.link { border-color:var(--brand-border); color:var(--brand); background:var(--brand-soft); }
  .row-actions { display:flex; gap:6px; }
  .pager { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 18px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; }
  .pager div { display:flex; gap:6px; }
  .feedback { margin-bottom:12px; padding:9px 12px; border:1px solid #bfe5d1; border-radius:8px; background:#f1fbf6; color:var(--green); font-size:12px; }
  .segmented { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .segmented button { height:34px; padding:0 14px; border:0; background:#fff; color:var(--soft-text); cursor:pointer; font:inherit; font-size:12px; }
  .segmented button.active { background:var(--brand); color:#fff; font-weight:700; }

  .settings-row small { color:var(--muted); }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  .kpis article { padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:#fff; }
  .kpis span { display:block; color:var(--muted); font-size:11px; } .kpis strong { display:block; font-size:19px; } .kpis small { color:var(--muted); font-size:11px; }

  .green { color:var(--green); } .red { color:var(--red); } .muted { color:var(--muted); }

  const body = items.map((r) => {

    const m = majorOf(r.major);
    if (editing) ssHandlers.edit = (v) => { s.draft = v; };
    const editOpts = [{ value: "", label: UNCLASSIFIED }, ...m.labels.map((l) => ({ value: l.name, label: path(l.name, l.parent), search: l.parent }))];
    const levelCells = editing
      ? `<td colspan="2">${ssHtml("edit", s.draft, editOpts, "搜索二级或三级细分")}</td>`
      : `<td>${r.sub ? `<span class="tag">${esc(r.parent)}</span>` : "—"}</td><td>${r.sub && r.parent !== r.sub ? `<span class="tag">${esc(r.sub)}</span>` : "—"}${r.overridden ? `<small class="cell-note">默认：${esc(r.defaultLabel)}</small>` : ""}</td>`;
    const actions = editing
      ? `<button type="button" class="btn primary" data-act="save" data-key="${esc(r.key)}">保存</button><button type="button" class="btn" data-act="cancel">取消</button>`
      : `<button type="button" class="btn link" data-act="edit" data-key="${esc(r.key)}">编辑</button>${r.overridden ? `<button type="button" class="btn" data-act="reset" data-key="${esc(r.key)}">恢复默认</button>` : ""}`;
    return `<tr><td>${esc(r.code) || "—"}</td><td class="name"><strong>${esc(r.name) || "—"}</strong></td><td>—</td><td>—</td><td>—</td><td><span class="tag l1">${esc(r.major)}</span></td>${levelCells}<td>${r.overridden ? "手动归类" : r.code ? "规格代码" : "名称"}</td><td><span class="status ${r.sub ? "ok" : "warn"}">${r.sub ? "已归类" : "未归类"}</span></td><td><div class="row-actions">${actions}</div></td></tr>`;
  }).join("") || `<tr><td colspan="11" class="muted">没有符合当前条件的货品。</td></tr>`;
  return `<p class="crumb">系统设置 › 主数据与映射 › 货品细分映射</p>
  ${s.feedback ? `<div class="feedback">✓ ${esc(s.feedback)}</div>` : ""}
  <section class="panel overview"><div><span class="eyebrow">品类分析 · 品类细分</span><h2>货品细分映射</h2>
    <p>映射默认来自《直饮机分类规格匹配.xlsx》直饮机部分、《净水器&amp;开水器分类.xlsx》净水器部分和开水器部分；一级类目即大类目，二级、三级类目来自映射表（只有一层细分的大类目不显示三级）；可在此手动调整，手动归类优先。</p></div>
    <div class="cards">
      <article><span>映射条数</span><strong>${num(rows.length)}</strong><small>映射表中的条目</small></article>
      <article><span>细分数</span><strong>${num(labelCount)}</strong><small>当前一级类目下可选的细分名称</small></article>
      <article><span>已归类货品</span><strong>${num(rows.filter((r) => r.sub).length)}</strong><small>命中映射</small></article>
      <article><span>未归类货品</span><strong>${num(rows.filter((r) => !r.sub).length)}</strong><small>覆盖分类中未进映射</small></article>
      <article><span>吉客云未找到</span><strong>—</strong><small>演示页未接吉客云档案</small></article>
    </div></section>
  <section class="panel"><div class="toolbar"><div><h2>货品归类明细</h2><p>共 ${num(selected.length)} 条符合条件</p></div>
    <div class="filters">
      <label class="field"><span>一级类目</span><select data-f="major"><option value="">全部一级类目</option>${MAP.majors.map((m) => `<option value="${esc(m.name)}"${s.major === m.name ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
      <div class="field"><span>细分名称</span>${ssHtml("filter", s.sub, fopts, "搜索二级或三级细分")}</div>
      <label class="field"><span>状态</span><select data-f="status"><option value="all">全部状态</option><option value="mapped"${s.status === "mapped" ? " selected" : ""}>已归类</option><option value="unclassified"${s.status === "unclassified" ? " selected" : ""}>未归类</option></select></label>
      <label class="field"><span>搜索</span><input type="search" data-f="q" value="${esc(s.q)}" placeholder="规格代码、名称、分类或细分"></label>
    </div></div>
    <div class="table-wrap${s.editing ? " editing" : ""}"><table><thead><tr><th>吉客云规格代码</th><th>货品名称</th><th>规格</th><th>供应链名称</th><th>吉客云分类</th><th>一级类目</th><th>二级类目</th><th>三级类目</th><th>匹配方式</th><th>状态</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="pager"><span>第 ${s.pageNo} / ${pages} 页 · 每页 ${PAGE_SIZE} 条</span><div><button type="button" class="btn" data-act="prev"${s.pageNo <= 1 ? " disabled" : ""}>上一页</button><button type="button" class="btn" data-act="next"${s.pageNo >= pages ? " disabled" : ""}>下一页</button></div></div>
  </section>`;
}

// ---- analysis page -------------------------------------------------------------
function mockProduct(major, code, name) {
  const r = seeded(`${major}|${code}|${name}`);
  const qty = Math.round(r() * 90);
  const price = 30000 + Math.round(r() * 400000);
  const net = qty * price;
  return { code, name, qty, net, cost: Math.round(net * (0.62 + r() * 0.16)), refund: Math.round(net * r() * 0.04), yoyBase: Math.round(net * (0.6 + r() * 0.9)), wowCur: Math.round(net * (0.18 + r() * 0.1)), wowPrev: Math.round(net * (0.18 + r() * 0.1)) };
}
function renderAnalysis() {
  const a = state.a;
  const m = majorOf(a.major);
  const hasLevels = m.labels.some((l) => l.parent !== l.name);
  const level = hasLevels ? a.level : "leaf";
  const groups = new Map();
  for (const l of m.labels) { const g = level === "parent" ? l.parent : l.name; if (!groups.has(g)) groups.set(g, { name: g, parent: l.parent, products: [] }); }
  for (const r of allRows().filter((x) => x.major === a.major && x.sub)) {
    const g = level === "parent" ? r.parent : r.sub;
    groups.get(g)?.products.push(mockProduct(a.major, r.code, r.name));
  }
  const metrics = [...groups.values()].map((g) => {
    const sum = (k) => g.products.reduce((s, p) => s + p[k], 0);
    const net = sum("net"), cost = sum("cost"), refund = sum("refund"), base = sum("yoyBase"), cur = sum("wowCur"), prev = sum("wowPrev");
    return { ...g, net, qty: sum("qty"), refund, profit: net - cost, margin: net ? (net - cost) / net : 0, refundRate: net ? refund / (net + refund) : 0, yoy: base ? net / base - 1 : null, wow: prev ? cur / prev - 1 : null, count: g.products.length };
  });
  const total = metrics.reduce((s, x) => s + x.net, 0);
  metrics.forEach((x) => { x.share = total ? x.net / total : 0; });
  const key = { net: "net", share: "share", qty: "qty", margin: "margin", yoy: "yoy", count: "count", name: "name" }[a.sortBy];
  metrics.sort((x, y) => { const vx = x[key], vy = y[key]; if (vx === null) return 1; if (vy === null) return -1; const d = typeof vx === "string" ? vx.localeCompare(vy, "zh-CN") : vx - vy; return a.dir === "desc" ? -d : d; });
  const levelName = !hasLevels ? "细分" : level === "parent" ? "二级类目" : "三级类目";
  const head = (k, label, cls = "num") => `<th class="${cls}"><button type="button" class="btn" style="border:0;background:none;padding:0;height:auto;color:inherit" data-sort="${k}">${label} ${a.sortBy === k ? (a.dir === "desc" ? "↓" : "↑") : "↕"}</button></th>`;
  const qtyAll = metrics.reduce((s, x) => s + x.qty, 0), profitAll = metrics.reduce((s, x) => s + x.profit, 0), countAll = metrics.reduce((s, x) => s + x.count, 0);
  ssHandlers.major = (v) => { a.major = v; a.open = []; };
  const majorOpts = MAP.majors.map((x) => ({ value: x.name, label: x.name }));
  const rows = metrics.map((x, i) => {
    const open = a.open.includes(x.name);
    const prod = open ? `<tr class="products"><td colspan="11"><table><thead><tr><th>规格代码</th><th>货品名称</th><th class="num">净销售额（模拟）</th><th class="num">净销量（模拟）</th></tr></thead><tbody>${
      x.products.sort((p, q) => q.net - p.net).slice(0, 50).map((p) => `<tr><td>${esc(p.code) || "—"}</td><td>${esc(p.name) || "—"}</td><td class="num">${money(p.net)}</td><td class="num">${num(p.qty)}</td></tr>`).join("")
    }</tbody></table>${x.products.length > 50 ? `<p class="muted">仅显示前 50 个货品。</p>` : ""}</td></tr>` : "";
    const note = hasLevels && level === "leaf" && x.parent !== x.name ? `<small class="cell-note">二级：${esc(x.parent)}</small>` : "";
    const edit = !hasLevels || level === "leaf" ? `<button type="button" class="btn" disabled title="演示页不保存">编辑</button>` : "";
    return `<tr><td>${i + 1}</td><td><strong>${esc(x.name)}</strong>${note}</td><td class="num"><strong>${money(x.net)}</strong></td><td class="num">${pct(x.share)}</td><td class="num">${num(x.qty)}</td><td class="num">${pct(x.refundRate)}</td><td class="num">${money(x.profit)}</td><td class="num ${x.margin < 0 ? "red" : "green"}">${pct(x.margin)}</td><td class="num ${tone(x.yoy)}">${cmp(x.yoy)}</td><td class="num">${num(x.count)}</td><td><div class="row-actions"><button type="button" class="btn link" data-open="${esc(x.name)}">${open ? "收起货品" : "查看货品"}</button>${edit}</div></td></tr>${prod}`;
  }).join("");
  return `<p class="crumb">销售分析 › 品类分析 › 品类细分</p>
  <section class="panel"><div class="settings-row"><div><span class="eyebrow">SUBDIVISION SETTINGS</span><h2>品类细分设置</h2><small>归集依据：货品细分映射（按吉客云规格代码归集，手动归类优先）</small></div>
    <div class="filters"><div class="field"><span>大类目</span>${ssHtml("major", a.major, majorOpts, "输入关键词搜索")}</div>
    ${hasLevels ? `<div class="field"><span>细分层级</span><div class="segmented" role="group" aria-label="细分层级"><button type="button" data-level="parent" class="${level === "parent" ? "active" : ""}">按二级</button><button type="button" data-level="leaf" class="${level === "leaf" ? "active" : ""}">按三级</button></div></div>` : `<div class="field"><span>细分层级</span><small class="muted" style="height:34px;display:flex;align-items:center">该大类目只有一层细分</small></div>`}</div></div></section>
  <section class="kpis">
    <article><span>细分净销售额（模拟）</span><strong>${money(total)}</strong><small>共 ${num(metrics.length)} 个${levelName === "细分" ? "细分" : levelName}</small></article>
    <article><span>净销量（模拟）</span><strong>${num(qtyAll)}</strong><small>退款以负值参与</small></article>
    <article><span>毛利额（模拟）</span><strong>${money(profitAll)}</strong><small>毛利率 ${pct(total ? profitAll / total : 0)}</small></article>
    <article><span>已归类货品</span><strong>${num(countAll)}</strong><small>映射表中的条目数</small></article>
  </section>
  <section class="panel"><div class="toolbar"><div><h2>品类细分明细</h2><p>${hasLevels && level === "parent" ? "按二级：同一二级下的三级细分合并汇总；新增/删除细分请切到“按三级”。" : "点击表头可在降序、升序间切换。"}</p></div></div>
    <div class="table-wrap"><table><thead><tr><th>排名</th>${head("name", levelName, "")}${head("net", "净销售额")}${head("share", "贡献率")}${head("qty", "净销量")}<th class="num">退货率</th><th class="num">毛利额</th>${head("margin", "毛利率")}${head("yoy", "同比")}${head("count", "货品数")}<th>操作</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr class="total"><td>合计</td><td>共 ${num(metrics.length)} 个</td><td class="num">${money(total)}</td><td class="num">100.0%</td><td class="num">${num(qtyAll)}</td><td></td><td class="num">${money(profitAll)}</td><td class="num">${pct(total ? profitAll / total : 0)}</td><td></td><td class="num">${num(countAll)}</td><td></td></tr></tfoot></table></div>
    <p class="hint">演示说明：金额、销量、毛利、同比均为按条目生成的模拟数字，只用来看布局和“按二级 / 按三级”切换；上线后以真实销售数据为准。</p>
  </section>`;
}

// ---- wiring ----------------------------------------------------------------
const root = document.getElementById("page");
function render() {
  root.innerHTML = state.page === "settings" ? renderSettings() : renderAnalysis();
  document.querySelectorAll(".page-tabs button").forEach((b) => b.classList.toggle("active", b.dataset.page === state.page));
  if (openSelect) { const input = root.querySelector(`[data-ss-search="${openSelect.id}"]`); if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } }
}
document.querySelector(".page-tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-page]"); if (!b) return; state.page = b.dataset.page; openSelect = null; render(); });
root.addEventListener("click", (e) => {
  const t = e.target.closest("button"); const s = state.s, a = state.a;
  if (!t) { if (openSelect && !e.target.closest(".ss")) { openSelect = null; render(); } return; }
  if (t.dataset.ssToggle) { openSelect = openSelect && openSelect.id === t.dataset.ssToggle ? null : { id: t.dataset.ssToggle, q: "" }; render(); return; }
  if (t.dataset.ssPick) { ssHandlers[t.dataset.ssPick](t.dataset.value); openSelect = null; render(); return; }
  if (openSelect && !t.closest(".ss")) openSelect = null;
  const act = t.dataset.act;
  if (act === "edit") { const r = allRows().find((x) => x.key === t.dataset.key); s.editing = r.key; s.draft = r.sub || ""; s.feedback = ""; }
  else if (act === "cancel") s.editing = "";
  else if (act === "save") { const r = allRows().find((x) => x.key === t.dataset.key); if (s.draft === r.defaultLabel) delete state.overrides[r.key]; else state.overrides[r.key] = s.draft; s.editing = ""; s.feedback = "已保存手动归类（演示，仅本页生效）"; }
  else if (act === "reset") { delete state.overrides[t.dataset.key]; s.feedback = "已恢复默认归类"; }
  else if (act === "prev") s.pageNo -= 1;
  else if (act === "next") s.pageNo += 1;
  else if (t.dataset.level) { a.level = t.dataset.level; a.open = []; }
  else if (t.dataset.sort) { a.dir = a.sortBy === t.dataset.sort && a.dir === "desc" ? "asc" : "desc"; a.sortBy = t.dataset.sort; }
  else if (t.dataset.open) { const n = t.dataset.open; a.open = a.open.includes(n) ? a.open.filter((x) => x !== n) : [...a.open, n]; }
  render();
});
root.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.ssSearch) { openSelect.q = t.value; render(); return; }
  if (t.dataset.f === "q") { state.s.q = t.value; state.s.pageNo = 1; clearTimeout(window.__qt); window.__qt = setTimeout(() => { render(); const i = root.querySelector('[data-f="q"]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); }
});
root.addEventListener("change", (e) => {
  const t = e.target; const s = state.s;
  if (t.dataset.f === "major") { s.major = t.value; s.sub = ""; s.pageNo = 1; s.editing = ""; render(); }
  if (t.dataset.f === "status") { s.status = t.value; s.pageNo = 1; render(); }
});
root.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openSelect) { openSelect = null; render(); }
  if (e.key === "Enter" && e.target.dataset.ssSearch) { const opts = root.querySelectorAll(".ss-opt"); if (opts.length === 1) opts[0].click(); }
});
render();
</script>
</body>
</html>
