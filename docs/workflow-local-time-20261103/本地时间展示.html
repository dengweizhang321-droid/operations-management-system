<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';img-src data:;font-src data:;connect-src 'none';base-uri 'none';form-action 'none'"><title>工作流本地时间 · 合成展示</title><style>:root {
  color-scheme: light;

  /* Brand */
  --color-brand: #396149;
  --color-brand-hover: #293f32;
  --color-brand-active: #24382c;
  --color-brand-soft: #f3f7f4;
  --color-brand-tint: #cce8d9;
  --color-brand-border: #abc4b4;

  /* Surfaces */
  --color-bg-app: #f5f7f6;
  --color-bg-surface: #ffffff;
  --color-bg-subtle: #f3f7f4;
  --color-surface-subtle: var(--color-bg-subtle);
  --color-bg-elevated: #ffffff;
  --color-bg-inverse: #293f32;

  /* Text */
  --color-text-primary: #33453a;
  --color-text-secondary: #526959;
  --color-text-muted: #7b8780;
  --color-text-inverse: #f3f7f4;
  --color-text-link: #396149;

  /* Borders and focus */
  --color-border-default: #e7ebe9;
  --color-border-strong: #c9d6ce;
  --color-focus-ring: rgba(103, 157, 131, 0.35);

  /* System feedback */
  --color-success: #16825d;
  --color-success-soft: #eaf8f3;
  --color-warning: #a96518;
  --color-warning-soft: #fff5e9;
  --color-danger: #c83e4d;
  --color-danger-soft: #fff0f1;
  --color-info: #315bc5;
  --color-info-soft: #edf3ff;

  /* Business movement: A-share convention, up red and down green. */
  --color-metric-up: #c83e4d;
  --color-metric-down: #16825d;
  --color-metric-neutral: #6f7d91;

  /* Supporting palette */
  --color-purple: #8167d9;
  --color-purple-soft: #f2effd;

  /* Spacing and size */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 30px;
  --space-8: 40px;
  --radius-sm: 6px;
  --radius-md: 9px;
  --radius-lg: 12px;
  --radius-pill: 999px;
  --control-height-sm: 32px;
  --control-height-md: 38px;
  --control-height-lg: 44px;
  --font-size-caption: 12px;
  --font-size-body: 14px;
  --font-size-heading: 18px;
  /* Unified typography scale: keep user-facing Chinese text readable and predictable. */
  --font-size-micro: 11px;
  --font-size-label: 13px;
  --font-size-card-title: 16px;
  --font-size-section: 18px;
  --font-size-page-title: 20px;
  --font-size-display: 24px;
  --font-size-kpi: 24px;
  --line-height-tight: 1.3;
  --line-height-body: 1.6;
  --line-height-readable: 1.75;

  /* Elevation and layout */
  --shadow-sm: 0 3px 10px rgba(34, 45, 65, 0.12);
  --shadow-md: 0 8px 24px rgba(31, 45, 68, 0.08);
  --shadow-overlay: 0 20px 50px rgba(31, 45, 68, 0.2);
  --app-sidebar-width: 244px;
  --app-sidebar-collapsed-width: 80px;
  --app-header-height: 82px;
  --app-header-height-mobile: 67px;
  --app-sticky-offset: var(--app-header-height);
  --z-sticky: 25;
  --z-sidebar: 40;
  --z-overlay: 80;
  --z-tooltip: 90;

  /* Legacy aliases: retire only after every business module has migrated. */
  --bg: var(--color-bg-app);
  --surface: var(--color-bg-surface);
  --surface-soft: var(--color-bg-subtle);
  --text: var(--color-text-primary);
  --muted: var(--color-text-muted);
  --line: var(--color-border-default);
  --nav: var(--color-bg-inverse);
  --nav-soft: #396149;
  --blue: var(--color-brand);
  --blue-dark: var(--color-brand-hover);
  --blue-soft: var(--color-brand-soft);
  --green: #27a978;
  --green-soft: #eaf8f3;
  --orange: #e99436;
  --orange-soft: #fff5e9;
  --purple: var(--color-purple);
  --purple-soft: var(--color-purple-soft);
  --red: #e45e67;
  --red-soft: #fff0f1;
  --shadow: 0 8px 24px rgba(31, 45, 68, 0.05);
  --sidebar-width: var(--app-sidebar-width);

  /* Existing late stylesheet sections already consume these names. */
  --card: var(--color-bg-surface);
  --ink: var(--color-text-primary);
  --ink-2: var(--color-text-secondary);
  --accent: var(--color-brand);
  --accent-soft: var(--color-brand-soft);
  --code-bg: #111827;
}

@media (max-width: 860px) {
  :root {
    --app-sticky-offset: var(--app-header-height-mobile);
  }
}

* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, select { cursor: pointer; }
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }

.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: var(--z-sidebar);
  width: var(--sidebar-width); display: flex; flex-direction: column;
  padding: 0 14px 16px; color: #d8e0ee; background: var(--nav);
  transition: width .25s ease, transform .25s ease;
}
.brand { position: relative; height: 82px; display: flex; align-items: center; gap: 11px; padding: 0 5px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-mark { width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center; border-radius: 11px; background: linear-gradient(145deg,#7da1ff,#4776e6); box-shadow: 0 8px 20px rgba(71,118,230,.3); font: 800 18px/1 Georgia, serif; color: #fff; }
.brand-copy { display: flex; flex-direction: column; overflow: hidden; white-space: nowrap; }
.brand-copy strong { color: #fff; letter-spacing: 1.8px; font-size: 14px; }

.collapse-button { position: absolute; right: -22px; top: 29px; z-index: var(--z-tooltip); width: 44px; height: 44px; border: 1px solid var(--color-border-default); border-radius: 50%; background: #fff; color: var(--color-text-secondary); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(34,45,65,.12); font-size: 19px; line-height: 1; }
.main-nav { min-height: 0; position: relative; display: flex; flex: 1; overflow: visible; }
.sidebar-navigation-scroll { min-height: 0; flex: 1; overflow-x: hidden; overflow-y: auto; padding-top: 17px; scrollbar-width: none; }
.sidebar-navigation-scroll::-webkit-scrollbar { display: none; }

.sidebar-navigation-link { position: relative; width: 100%; min-height: 49px; display: flex; align-items: center; gap: 11px; padding: 7px 9px; border: 0; border-radius: 9px; text-align: left; text-decoration: none; background: transparent; color: #aab5c7; transition: .18s ease; }

.nav-icon { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border-radius: 8px; background: rgba(255,255,255,.06); color: #b8c4d6; font-size: 11px; font-weight: 800; }

/* Keep the AI annotation review workspace compact and fully visible without horizontal scrolling. */
.annotation-task-card,
.annotation-review-card {
  padding: 13px;
}
.annotation-task-card .section-header,
.annotation-review-card .section-header {
  gap: 10px;
}
.annotation-form-row,
.annotation-review-toolbar {
  gap: 7px;
  margin: 9px 0;
}
.annotation-form-row label {
  min-width: 130px;
}
.annotation-task-setup {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(280px, .75fr);
  gap: 14px;
  margin: 14px 0;
}
.annotation-task-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px 12px;
}
.annotation-task-fields label,
.annotation-concurrency-card label,
.annotation-current-run > label {
  min-width: 0;
  display: grid;
  align-content: start;
  gap: 5px;
}
.annotation-task-fields label > span,
.annotation-concurrency-card label > span,
.annotation-current-run > label > span,
.annotation-concurrency-card > div > span,
.annotation-current-run-summary > span {
  color: #76869b;
  font-size: 8px;
}
.annotation-task-fields input,
.annotation-task-fields select,
.annotation-concurrency-control input {
  width: 100%;
  min-width: 0;
  min-height: 38px;
  padding: 7px 9px;
  border: 1px solid #d7e1ed;
  border-radius: 7px;
  color: #40516a;
  background: #fff;
}
.annotation-task-fields small,
.annotation-concurrency-card small,
.annotation-current-run small,
.annotation-task-footer small,
.annotation-job-heading small {
  color: var(--color-text-secondary);
  line-height: 1.55;
}
.annotation-concurrency-card {
  display: grid;
  align-content: start;
  gap: 12px;
  padding: 14px;
  border: 1px solid #cad9ef;
  border-radius: 10px;
  background: linear-gradient(145deg, #f3f7ff, #fbfdff);
}
.annotation-concurrency-card > div,
.annotation-current-run-summary {
  min-width: 0;
  display: grid;
  gap: 4px;
}
.annotation-concurrency-card > div > strong,
.annotation-current-run-summary > strong {
  overflow: hidden;
  color: #385b92;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.annotation-concurrency-control {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 7px;
}
.annotation-concurrency-control button {
  min-width: 82px;
  white-space: nowrap;
}
.annotation-task-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0 14px;
  border-top: 1px solid #e5ebf3;
}
.annotation-current-run {
  display: grid;
  grid-template-columns: minmax(180px, .7fr) minmax(260px, .9fr) minmax(280px, auto);
  align-items: end;
  gap: 14px;
  margin-bottom: 14px;
  padding: 14px;
  border: 1px solid #d6e2f3;
  border-radius: 10px;
  background: #f8fbff;
}
.annotation-current-run-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
}
.annotation-current-run-actions button {
  white-space: nowrap;
}
.annotation-current-run-local {
  align-self: center;
}
.annotation-job-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 2px;
}
.annotation-review-toolbar label {
  min-width: 130px;
}
.annotation-review-category-filter {
  min-width: 185px;
}
.annotation-review-toolbar select,
.annotation-review-category-filter summary {
  min-height: 32px;
  padding: 5px 8px;
  font-size: 9px;
}
.annotation-job-list {
  max-height: 240px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
  margin: 9px 0;
  padding: 2px 4px 2px 2px;
  overflow-y: auto;
}
.annotation-job-entry {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: stretch;
  border: 1px solid #dce4ef;
  border-radius: 8px;
  background: #fff;
  overflow: hidden;
}
.annotation-job-entry.active {
  border-color: #5b82dc;
  background: #f2f6ff;
}
.annotation-job-list .annotation-job-select {
  min-width: 0;
  display: grid;
  gap: 3px;
  padding: 10px;
  border: 0;
  border-radius: 0;
  background: transparent;
  text-align: left;
}
.annotation-job-list .annotation-job-delete {
  min-width: 74px;
  display: block;
  padding: 8px;
  border: 0;
  border-left: 1px solid #f1d4d4;
  border-radius: 0;
  color: #b94b4b;
  background: #fff8f8;
  font-size: 9px;
  text-align: center;
  white-space: nowrap;
}
.annotation-job-list .annotation-job-delete:hover:not(:disabled) {
  background: #ffeded;
}
.annotation-review-table-wrap {
  width: 100%;
  overflow-x: clip;
}
.annotation-review-table {
  width: 100%;
  min-width: 0;
  table-layout: fixed;
  font-size: 9px;
}
.annotation-review-table th,
.annotation-review-table td {
  min-width: 0;
  height: auto;
  padding: 7px 5px;
  overflow-wrap: anywhere;
  white-space: normal;
}
.annotation-review-table th:nth-child(n) {
  min-width: 0;
}
.annotation-review-table th:nth-child(1) { width: 3%; }
.annotation-review-table th:nth-child(2) { width: 8%; }
.annotation-review-table th:nth-child(3) { width: 20%; }
.annotation-review-table th:nth-child(4) { width: 13%; }
.annotation-review-table th:nth-child(5) { width: 18%; }
.annotation-review-table th:nth-child(6) { width: 14%; }
.annotation-review-table th:nth-child(7) { width: 11%; }
.annotation-review-table th:nth-child(8) { width: 13%; }
.annotation-review-table td > strong,
.annotation-review-table td > small,
.annotation-review-table td > code,
.annotation-review-table .annotation-product-link small {
  max-width: 100%;
  overflow-wrap: anywhere;
  white-space: normal;
}
.annotation-review-table td > small,
.annotation-review-table td > code {
  line-height: 1.35;
}
.annotation-review-table td:nth-child(3) small,
.annotation-review-table td:nth-child(5) small {
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.annotation-review-table td:nth-child(4) code {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.annotation-review-table input[type="number"],
.annotation-review-table select {
  width: 100%;
  min-width: 0;
  min-height: 30px;
  padding: 4px 6px;
  font-size: 9px;
}
.annotation-review-table input[type="checkbox"] {
  width: 14px;
  height: 14px;
}
.annotation-review-table .annotation-image,
.annotation-review-table .annotation-no-image,
.annotation-review-table .annotation-image-link {
  width: 64px;
  height: 64px;
  max-width: 100%;
}
.annotation-review-table .annotation-image-link .annotation-image {
  width: 100%;
  height: 100%;
}
.annotation-review-pagination {
  gap: 6px;
}
.annotation-review-pagination > span {
  min-width: 0;
}
.annotation-review-pagination select {
  height: 30px;
}
.annotation-review-gallery {
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
@media(max-width:1180px) {
  .annotation-current-run {
    grid-template-columns: minmax(180px, .7fr) minmax(260px, 1fr);
  }
  .annotation-current-run-actions,
  .annotation-current-run-local {
    grid-column: 1 / -1;
    justify-content: flex-start;
  }
  .annotation-review-table th:nth-child(1) { width: 4%; }
  .annotation-review-table th:nth-child(2) { width: 9%; }
  .annotation-review-table th:nth-child(3) { width: 20%; }
  .annotation-review-table th:nth-child(4) { width: 12%; }
  .annotation-review-table th:nth-child(5) { width: 18%; }
  .annotation-review-table th:nth-child(6) { width: 15%; }
  .annotation-review-table th:nth-child(7) { width: 11%; }
  .annotation-review-table th:nth-child(8) { width: 11%; }
  .annotation-review-table .annotation-image,
  .annotation-review-table .annotation-no-image,
  .annotation-review-table .annotation-image-link {
    width: 54px;
    height: 54px;
  }
}

/* New-product weekly sales follow-up. */
.new-product-followup-view { display: grid; gap: 16px; }
.launch-followup-hero { background: linear-gradient(132deg, var(--color-brand-soft) 0%, #fff 48%, #eef9f5 100%); }
.launch-followup-controls { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; padding: 14px 18px; }
.launch-followup-controls label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
.launch-followup-controls input { min-width: 170px; }
.launch-followup-controls > span { margin-left: auto; color: var(--muted); font-size: 13px; }
.launch-followup-controls > strong { color: #a85a11; font-size: 13px; }
.launch-followup-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.launch-followup-summary article { display: grid; gap: 7px; min-height: 118px; padding: 18px; }
.launch-followup-summary span,.launch-followup-summary small { color: var(--muted); }
.launch-followup-summary strong { font-size: 24px; letter-spacing: -.02em; }
.launch-followup-table { min-width: 1280px; }
.launch-followup-table td > strong,.launch-followup-table td > small { display: block; }
.launch-followup-table td > small { max-width: 220px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); white-space: nowrap; }
.launch-followup-product-image { width: 74px; min-width: 74px; text-align: center; }
.launch-followup-product-image img { width: 54px; height: 54px; display: block; margin: auto; padding: 3px; border-radius: 8px; object-fit: contain; object-position: center; background: #fff; }
.launch-followup-product-image span { color: var(--muted); font-size: 11px; }
.launch-followup-paused-row { opacity: .72; }
.launch-followup-actions { display: flex; flex-wrap: wrap; gap: 8px; min-width: 178px; }
.launch-followup-actions .row-action.warning { color: #9b5617; background: #fff0df; }
.launch-followup-actions .row-action.success { color: #17724a; background: #e7f7ef; }
.followup-target_achieved { background: #e7f7ef; color: #17724a; }
.followup-selling { background: #e8f1ff; color: #285ba5; }
.followup-no_sales,.followup-stalled,.followup-missing_codes { background: #fff0df; color: #9b5617; }
.followup-not_started,.followup-paused { background: #eef0f4; color: #646b78; }
.launch-followup-code-detail { border-top: 1px solid var(--line); padding: 18px; }
.launch-followup-code-detail h3 { margin: 0 0 12px; }
.launch-followup-code-detail > div { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.launch-followup-code-detail article { display: grid; gap: 4px; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fafbfe; }
.launch-followup-code-detail article span,.launch-followup-code-detail article small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.launch-followup-code-detail article small { color: var(--muted); }
.launch-followup-bottom { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, .7fr); gap: 16px; }
.launch-followup-message,.launch-followup-config { padding: 18px; }
.launch-followup-message > header,.launch-followup-config > header { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.launch-followup-message h3,.launch-followup-config h3 { margin: 0; }
.launch-followup-message header p,.launch-followup-config header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.launch-followup-message pre { max-height: 430px; margin: 0; overflow: auto; padding: 16px; border-radius: 12px; background: #111827; color: #e9f0fb; font: 13px/1.75 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
.launch-followup-config { display: grid; align-content: start; gap: 12px; }
.launch-followup-config label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
.launch-followup-config > div { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.launch-followup-config .workflow-checkbox-field,.new-product-line-modal .workflow-checkbox-field { display: flex; align-items: center; grid-column: 1 / -1; }
.launch-followup-matrix { overflow: hidden; padding: 0; }
.launch-followup-matrix > header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px; }
.launch-followup-matrix > header h3 { margin: 3px 0 5px; }
.launch-followup-matrix > header p { margin: 0; color: var(--muted); font-size: 13px; }
.launch-followup-matrix > header > div:last-child { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.launch-followup-matrix-scroll { overflow-x: auto; border-block: 1px solid #b7c9e7; }
.launch-followup-matrix-table { min-width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; color: #17233c; }
.launch-followup-matrix-table th,.launch-followup-matrix-table td { width: 116px; min-width: 116px; height: 76px; border-right: 1px solid #b7c9e7; border-bottom: 1px solid #b7c9e7; padding: 8px; text-align: center; }
.launch-followup-matrix-table thead th { position: sticky; top: 0; z-index: 2; height: 76px; background: #4477c8; color: #fff; }
.launch-followup-matrix-table th strong,.launch-followup-matrix-table th span,.launch-followup-matrix-table th small { display: block; }
.launch-followup-matrix-table th span { margin-top: 3px; font-size: 11px; }
.launch-followup-matrix-table th small { margin-top: 3px; color: #ffe5a3; font-size: 10px; }
.launch-followup-matrix-table th:nth-child(1),.launch-followup-matrix-table td:nth-child(1) { position: sticky; left: 0; z-index: 3; width: 90px; min-width: 90px; font-weight: 700; }
.launch-followup-matrix-table th:nth-child(2),.launch-followup-matrix-table td:nth-child(2) { position: sticky; left: 90px; z-index: 3; width: 96px; min-width: 96px; }
.launch-followup-matrix-table th:nth-child(3),.launch-followup-matrix-table td:nth-child(3) { position: sticky; left: 186px; z-index: 3; width: 180px; min-width: 180px; text-align: left; font-weight: 700; }
.launch-followup-matrix-table th:nth-child(4),.launch-followup-matrix-table td:nth-child(4) { position: sticky; left: 366px; z-index: 3; width: 150px; min-width: 150px; }
.launch-followup-matrix-table thead th:nth-child(-n+4) { z-index: 4; text-align: center; }
.launch-followup-matrix-table tbody td:nth-child(-n+4) { background: #fff; }
.launch-followup-matrix-table tbody tr.alternate td { background: #dbe5f5; }
.launch-followup-matrix-table tbody tr.alternate td:nth-child(-n+4) { background: #dbe5f5; }
.launch-followup-matrix-table tbody tr:last-child td { border-bottom: 0; }
.launch-followup-matrix-image img { width: 58px; height: 58px; display: block; margin: auto; padding: 3px; border-radius: 7px; object-fit: contain; object-position: center; background: #fff; }
.launch-followup-matrix-image span { color: var(--muted); font-size: 11px; }
.launch-followup-sparkline { display: block; width: 100%; height: 42px; color: #4777b5; }
.launch-followup-matrix > footer { display: flex; justify-content: space-between; gap: 18px; padding: 11px 18px; color: var(--muted); font-size: 12px; }
.launch-followup-robot { padding: 20px; }
.launch-followup-robot > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.launch-followup-robot > header h3 { margin: 3px 0 5px; }
.launch-followup-robot > header p { margin: 0; color: var(--muted); font-size: 13px; }
.launch-followup-robot > header > span { border-radius: 999px; padding: 5px 10px; background: #eef3fb; color: #4b617d; font-size: 12px; font-weight: 700; }
.launch-followup-robot-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.launch-followup-robot-grid label,.launch-followup-schedule label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
.launch-followup-robot-grid input[readonly] { background: #f7f9fc; color: #43516a; }
.launch-followup-robot-notice { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 14px; padding: 13px 15px; border: 1px solid #b8d5ff; border-radius: 12px; background: #eef6ff; color: #315272; font-size: 13px; }
.launch-followup-schedule { display: grid; grid-template-columns: minmax(180px, .5fr) minmax(180px, .5fr) minmax(260px, 1fr); gap: 12px; align-items: end; margin-top: 16px; }
.launch-followup-schedule .workflow-checkbox-field { min-height: 42px; display: flex; align-items: center; }
.ai-ding-schedules { margin: 18px 0; }
.ai-ding-table-wrap { overflow-x: auto; }
.ai-ding-table-wrap table { width: 100%; border-collapse: collapse; min-width: 980px; text-align: left; }
.ai-ding-table-wrap th,.ai-ding-table-wrap td { padding: 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.ai-ding-prompt { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-ding-error { color: #b42318; }.ai-ding-notice { color: #087443; }
.ai-ding-modal-backdrop { position: fixed; inset: 0; z-index: 100; background: #10182899; display: grid; place-items: center; padding: 20px; }
.ai-ding-modal { width: min(640px, 100%); max-height: 90vh; overflow-y: auto; background: var(--surface, #fff); border-radius: 12px; padding: 24px; box-shadow: 0 24px 70px #10182855; }
.launch-followup-robot > small { display: block; margin-top: 12px; color: var(--muted); }
.launch-followup-robot-actions { display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin-top: 16px; }
.launch-followup-robot-actions span { margin-right: auto; color: var(--muted); font-size: 12px; }
.dingtalk-settings-workspace { display: grid; gap: 16px; }
.dingtalk-settings-intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 22px; background: linear-gradient(135deg, #fff, #f1f6ff); }
.dingtalk-settings-intro h2 { margin: 4px 0 7px; }
.dingtalk-settings-intro p { max-width: 840px; margin: 0; color: var(--muted); line-height: 1.65; }
.dingtalk-settings-guide { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 18px; padding: 18px 20px; border-color: #b8d5ff; background: #eef6ff; color: #315272; }
.dingtalk-settings-guide ol { display: grid; gap: 7px; margin: 0; padding-left: 20px; }
.dingtalk-settings-form { margin: 0; }
.dingtalk-settings-delivery { grid-column: 1 / -1; }
.dingtalk-settings-form .launch-followup-robot-grid small,.dingtalk-settings-delivery small { color: var(--muted); font-weight: 400; }
.launch-followup-robot-actions a.secondary-button { text-decoration: none; }
.new-product-line-modal .new-product-line-codes { grid-column: 1 / -1; }
.new-product-line-modal .new-product-line-codes small { color: var(--muted); }
.new-product-line-image-field { display: grid; grid-column: 1 / -1; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
.new-product-line-image-picker { min-width: 0; display: grid; grid-template-columns: 86px minmax(0,1fr); align-items: center; gap: 14px; padding: 12px; border: 1px dashed #b7c9e7; border-radius: 11px; background: #f8fbff; }
.new-product-line-image-picker > img,.new-product-line-image-picker > span { width: 86px; height: 86px; display: grid; place-items: center; padding: 4px; border-radius: 9px; background: #fff; color: #6680a4; object-fit: contain; object-position: center; }
.new-product-line-image-picker > div { min-width: 0; display: grid; gap: 7px; }
.new-product-line-image-picker strong,.new-product-line-image-picker small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.new-product-line-image-picker strong { color: #42536a; }
.new-product-line-image-picker small { color: var(--muted); font-weight: 400; }
.new-product-line-image-picker > div > div { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 1100px) {
  .launch-followup-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .launch-followup-bottom { grid-template-columns: 1fr; }
  .launch-followup-code-detail > div { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 680px) {
  .launch-followup-summary,.launch-followup-code-detail > div { grid-template-columns: 1fr; }
  .launch-followup-controls > span { margin-left: 0; width: 100%; }
  .launch-followup-config > div { grid-template-columns: 1fr; }
  .launch-followup-matrix > header,.launch-followup-matrix > footer,.launch-followup-robot-actions { align-items: stretch; flex-direction: column; }
  .launch-followup-matrix > header > div:last-child { justify-content: space-between; }
  .launch-followup-robot-grid,.launch-followup-schedule { grid-template-columns: 1fr; }
  .dingtalk-settings-intro { flex-direction: column; }
  .dingtalk-settings-guide { grid-template-columns: 1fr; }
  .new-product-line-image-picker { grid-template-columns: 64px minmax(0,1fr); }
  .new-product-line-image-picker > img,.new-product-line-image-picker > span { width: 64px; height: 64px; }
}
@media(max-width:900px) {
  .annotation-task-setup,
  .annotation-current-run {
    grid-template-columns: 1fr;
  }
  .annotation-current-run-actions,
  .annotation-current-run-local {
    grid-column: auto;
  }
}
@media(max-width:760px) {
  .annotation-task-card,
  .annotation-review-card {
    padding: 10px;
  }
  .annotation-review-toolbar label,
  .annotation-review-category-filter {
    flex: 1 1 145px;
    min-width: 0;
  }
  .annotation-review-table {
    font-size: 8px;
  }
  .annotation-review-table th,
  .annotation-review-table td {
    padding: 5px 3px;
  }
  .annotation-task-fields {
    grid-template-columns: 1fr;
  }
  .annotation-task-footer,
  .annotation-job-heading,
  .annotation-current-run-actions {
    align-items: stretch;
    flex-direction: column;
  }
  .annotation-task-footer button,
  .annotation-current-run-actions button {
    width: 100%;
  }
}

/* n8n 工作流中心 */
.n8n-workflow-module {
  display: grid;
  gap: 15px;
}
.n8n-workflow-switcher {
  display: flex;
  gap: 9px;
  padding: 5px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--color-brand-soft);
}
.n8n-workflow-switcher button {
  min-width: 220px;
  display: flex;
  flex: 1 0 220px;
  align-items: center;
  gap: 9px;
  padding: 9px 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--color-text-secondary);
  background: transparent;
  text-align: left;
}
.n8n-workflow-switcher button > span {
  width: 28px;
  height: 28px;
  display: grid;
  flex: 0 0 28px;
  place-items: center;
  border-radius: 8px;
  color: var(--color-text-secondary);
  background: var(--color-brand-soft);
  font-size: 10px;
  font-weight: 800;
}
.n8n-workflow-switcher button strong {
  overflow: hidden;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.n8n-workflow-switcher button.is-active {
  border-color: #f0d4cd;
  color: var(--color-text-secondary);
  background: #fff;
  box-shadow: 0 5px 12px rgba(37, 53, 76, .055);
}
.n8n-workflow-switcher button.is-active > span {
  color: #fff;
  background: linear-gradient(135deg, #ff8269, #ef5c42);
}
.n8n-workflow-hero {
  min-height: 188px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 30px;
  padding: 30px 34px;
  overflow: hidden;
  border-radius: 14px;
  color: #fff;
  background:
    radial-gradient(circle at 82% 12%, rgba(255, 255, 255, .14), transparent 26%),
    radial-gradient(circle at 8% 100%, rgba(255, 109, 80, .2), transparent 34%),
    linear-gradient(125deg, var(--color-brand-hover) 0%, var(--color-brand-hover) 54%, #3a2a38 100%);
  box-shadow: 0 18px 38px rgba(29, 40, 62, .18);
}
.n8n-workflow-hero-copy {
  min-width: 0;
}
.n8n-workflow-kicker {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #ffb3a3;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-transform: uppercase;
}
.n8n-workflow-kicker i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff6d50;
  box-shadow: 0 0 0 6px rgba(255, 109, 80, .14);
}
.n8n-workflow-hero h2 {
  margin: 13px 0 7px;
  font-size: clamp(22px, 2.3vw, 32px);
  letter-spacing: -.5px;
}
.n8n-workflow-hero p {
  margin: 0;
  color: var(--color-brand-tint);
  font-size: 11px;
}
.n8n-workflow-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 20px;
}
.n8n-workflow-tags span {
  padding: 6px 9px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 99px;
  color: #d9e1ee;
  background: rgba(255, 255, 255, .065);
  font-size: 8px;
}
.n8n-workflow-hero-status {
  min-width: 210px;
  display: grid;
  justify-items: end;
  gap: 10px;
}
.n8n-workflow-hero-status > span {
  padding: 6px 10px;
  border-radius: 99px;
  font-size: 8px;
  font-weight: 800;
}
.n8n-workflow-hero-status .is-active {
  color: #9bf0c9;
  background: rgba(49, 190, 132, .16);
}
.n8n-workflow-hero-status .is-draft {
  color: #ffd5a6;
  background: rgba(238, 159, 62, .16);
}
.n8n-workflow-hero-status strong {
  color: #fff;
  font-size: 24px;
  letter-spacing: 4px;
}
.n8n-workflow-hero-status small {
  color: #8f9db3;
  font-size: 8px;
}
.n8n-workflow-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
}
.n8n-workflow-metrics article {
  min-height: 98px;
  display: grid;
  align-content: center;
  gap: 5px;
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 7px 18px rgba(35, 49, 70, .035);
}
.n8n-workflow-metrics span,
.n8n-workflow-metrics small {
  color: #8996a8;
  font-size: 8px;
}
.n8n-workflow-metrics strong {
  color: #263951;
  font-size: 20px;
}
.n8n-pipeline-panel,
.n8n-editor-panel {
  padding: 0;
  overflow: hidden;
}
.n8n-panel-heading {
  min-height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 16px 19px;
  border-bottom: 1px solid var(--color-border-default);
}
.n8n-panel-heading > div:first-child {
  min-width: 0;
}
.n8n-panel-heading span {
  color: var(--color-text-muted);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 1px;
}
.n8n-panel-heading h3 {
  margin: 4px 0;
  color: var(--color-text-secondary);
  font-size: 15px;
}
.n8n-panel-heading p {
  margin: 0;
  color: var(--color-text-muted);
  font-size: 9px;
}
.n8n-panel-heading .n8n-loopback-badge {
  flex: 0 0 auto;
  padding: 7px 10px;
  border-radius: 99px;
  color: #30765f;
  background: #eaf8f2;
  letter-spacing: 0;
}
.n8n-loopback-status {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
}
.n8n-panel-heading .n8n-helper-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 99px;
  color: #7d5a20;
  background: #fff5e4;
  letter-spacing: 0;
}
.n8n-helper-pill i,
.n8n-helper-banner > span i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 14%, transparent);
}
.n8n-panel-heading .n8n-helper-pill.is-ready {
  color: #247358;
  background: #e9f8f1;
}
.n8n-panel-heading .n8n-helper-pill.is-running {
  color: var(--color-brand);
  background: var(--color-brand-soft);
}
.n8n-panel-heading .n8n-helper-pill.is-cookie-missing,
.n8n-panel-heading .n8n-helper-pill.is-offline {
  color: #a74638;
  background: #fff0ed;
}
.n8n-pipeline-flow {
  min-width: 1120px;
  display: flex;
  align-items: stretch;
  gap: 10px;
  padding: 22px 20px 25px;
  overflow-x: auto;
  background: linear-gradient(180deg, #fff, #fafcff);
}
.n8n-trigger-stack {
  width: 190px;
  flex: 0 0 190px;
  display: grid;
  gap: 8px;
}
.n8n-trigger-stack > div {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px;
  border: 1px solid #dce5f0;
  border-radius: 9px;
  background: #fff;
}
.n8n-trigger-stack i {
  width: 29px;
  height: 29px;
  display: grid;
  flex: 0 0 29px;
  place-items: center;
  border-radius: 8px;
  color: #4776e6;
  background: #edf3ff;
  font-style: normal;
  font-weight: 800;

.n8n-trigger-stack i.schedule {
  color: #936524;
  background: #fff5e7;
}
.n8n-trigger-stack span {
  min-width: 0;
}
.n8n-trigger-stack strong,
.n8n-trigger-stack small {
  display: block;
}
.n8n-trigger-stack strong {
  color: #334860;
  font-size: 9px;

.n8n-trigger-stack small {

  color: #94a0af;

.n8n-flow-arrow {

  flex: 0 0 18px;

  color: #91a8d6;

.n8n-stage-card {

  justify-content: space-between;

  height: 27px;
  display: grid;
  flex: 0 0 27px;
  place-items: center;

.n8n-stage-card strong {
  color: #30445c;

.n8n-stage-card p {
  margin: 0;

  align-items: center;

  justify-content: center;
  padding: 0 12px;

  color: var(--color-text-secondary);
  background: #fff;
  font-size: 9px;
  font-weight: 700;
  text-decoration: none;

.n8n-editor-actions a {
  border-color: #f3684e;
  color: #fff;
  background: #f3684e;

.n8n-helper-banner {

  align-items: center;
  gap: 11px;

/* Sales category analysis */
.sales-category-view { display: grid; gap: 16px; }
.category-filter-panel { padding: 18px 20px; overflow: visible; }
.category-filter-heading,.category-section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.category-filter-heading h2,.category-section-heading h2 { margin: 2px 0 4px; color: var(--color-text-secondary); font-size: 16px; }
.category-filter-heading p,.category-section-heading p { margin: 0; color: var(--color-text-secondary); font-size: 9px; line-height: 1.6; }
.category-filter-layout { display: grid; grid-template-columns: 180px minmax(0,1fr); gap: 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--color-border-default); }
.category-level-field { display: grid; align-content: center; gap: 6px; min-height: 84px; padding: 12px 14px; border: 1px solid #e2e9f2; border-radius: 9px; background: linear-gradient(145deg,#f8fbff,#f3f7fd); }
.category-filter-controls { display: grid; gap: 11px; min-width: 0; }
.category-filter-fields { display: grid; grid-template-columns: repeat(4,minmax(118px,1fr)) minmax(230px,1.55fr); gap: 10px; align-items: end; }
.category-filter-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; min-height: 32px; }
.category-filter-actions > span { color: var(--color-text-secondary); font-size: 8px; }
.category-product-query { display: grid; gap: 5px; min-width: 0; }
.category-level-field > span,.category-product-query > span { color: #8190a4; font-size: 8px; }

.category-level-field small { color: #a0aab8; font-size: 7px; }
.category-product-query input,.category-filter-search input { border: 0; outline: 0; background: transparent; color: var(--color-text-secondary); font-size: 9px; }
.category-product-query input { height: 34px; padding: 0 10px; border: 1px solid #dce5f0; border-radius: 7px; background: #fff; }
.category-filter-menu { position: relative; min-width: 0; }
.category-filter-menu > summary { display: grid; gap: 3px; width: 100%; height: 34px; padding: 5px 26px 5px 10px; border: 1px solid var(--color-border-default); border-radius: 7px; background: #fff; cursor: pointer; list-style: none; }
.category-filter-menu > summary::-webkit-details-marker { display: none; }

.category-filter-search { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px; border: 1px solid var(--color-border-default); border-radius: 6px; color: var(--color-text-muted); }
.category-filter-search input { width: 100%; }
.category-filter-options { max-height: 220px; overflow: auto; margin: 8px 0; }
.category-filter-options label { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 5px 7px; border-radius: 5px; color: var(--color-text-secondary); font-size: 9px; cursor: pointer; }
.category-filter-options label:hover,.category-filter-options label.selected { background: var(--color-brand-soft); color: var(--color-brand); }
.category-filter-options label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.category-filter-options p { color: var(--color-text-muted); font-size: 8px; text-align: center; }
.category-filter-popover > button { width: 100%; padding: 6px; border: 0; border-radius: 5px; background: var(--color-brand-soft); color: var(--color-text-secondary); font-size: 8px; cursor: pointer; }
.category-granularity { margin-left: 0; }
.category-filter-reset { height: 34px; }
.category-filter-note { flex-basis: 100%; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--color-border-default); color: var(--color-text-secondary); font-size: 8px; }
.category-filter-note.error { color: #c55c54; }
.category-kpi-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; }

.category-kpi-grid small { color: #98a4b3; font-size: 8px; }
.category-unclassified-notice { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border: 1px solid #f0d7b5; border-radius: 8px; background: #fffaf2; color: #805f35; }

.category-ranking-list > div > span { color: #8291a5; font-size: 11px; font-weight: 750; text-align: center; }

.category-ranking-list small { display: block; margin-top: 3px; color: #8797aa; font-size: 7px; }
.category-ranking-list i b { background: linear-gradient(90deg,#37a983,#78c5ad); }
.category-trend-legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; color: #687c95; font-size: 8px; }
.category-trend-legend span { display: inline-flex; align-items: center; gap: 5px; }
.category-trend-legend i { width: 7px; height: 7px; border-radius: 50%; }

.category-trend-chart svg { display: block; min-width: 660px; width: 100%; height: 230px; }
.category-trend-chart text { fill: #8b99aa; font-size: 8px; }
.category-chart-axis { stroke: #dce5ef; stroke-width: 1; }
.category-detail-table { min-width: 1580px; }
.category-detail-table th button { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }
.category-detail-table td:nth-child(n+3) { font-variant-numeric: tabular-nums; white-space: nowrap; }
.category-detail-trend { display: flex; align-items: center; gap: 7px; min-width: 132px; color: #71849d; }
.category-detail-trend svg { width: 104px; height: 28px; overflow: visible; }
.category-detail-trend polyline { stroke: currentColor; }
.category-detail-trend circle { fill: currentColor; }
.category-detail-trend small { min-width: 42px; color: currentColor; font-size: 8px; text-align: right; }

/* Keep filter-driven refreshes in place: existing data fades while the next
   response is validated, and the gradient never blocks another selection. */
.module-stage,
.data-refresh-region {
  min-width: 0;
  position: relative;
}

.module-stage {
  min-height: 330px;
}

/* The full-page chat lives in AiWorkspaceHost below this tabs-only stage. */
.module-stage.module-stage-ai-chat {
  min-height: 0;
}

.module-stage > *,
.data-refresh-region > * {
  transition: opacity 180ms ease, filter 180ms ease;
}

.module-stage::after,
.data-refresh-region::after {
  width: 100%;
  height: 3px;
  content: "";
  position: absolute;
  z-index: 80;
  top: 0;
  left: 0;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(90deg, transparent 0%, #85a9f4 32%, #8d63d8 50%, #63c6b5 68%, transparent 100%);
  background-size: 220% 100%;
  transition: opacity 160ms ease;
}

.module-stage-pending > *,
.data-refresh-region[aria-busy="true"] > * {
  opacity: .76;
  filter: saturate(.92);
}

.module-stage-pending::after,
.data-refresh-region[aria-busy="true"]::after {
  opacity: 1;
  animation: data-refresh-gradient 1.15s linear infinite;
}

@keyframes data-refresh-gradient {
  from { background-position: 180% 0; }
  to { background-position: -80% 0; }
}

@media (prefers-reduced-motion: reduce) {
  .module-stage > *,
  .data-refresh-region > *,
  .module-stage::after,
  .data-refresh-region::after {
    transition: none;
  }

  .module-stage-pending::after,
  .data-refresh-region[aria-busy="true"]::after {
    animation: none;
    background-position: 50% 0;
  }
}

/* Both overview modes keep their switch usable before the new bundle loads. */
.overview-view-switch { display:flex; justify-content:flex-end; gap:0; margin:0 0 12px; }
.overview-view-switch button { border:1px solid var(--color-border-default); padding:7px 18px; background:white; color:var(--color-brand); font-size:var(--font-size-body); }
.overview-view-switch button:first-child { border-radius:6px 0 0 6px; }
.overview-view-switch button:last-child { border-radius:0 6px 6px 0; }
.overview-view-switch button[aria-pressed=true] { background:var(--color-brand); color:white; }
/* 商品经营试点：预留分区空间，依赖筛选就绪前保留入口。 */
.product-dependent-filters { display: flex; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.product-dependent-filters legend { font-size: 12px; color: var(--color-text-muted, #64748b); }
.product-list-region { min-height: 320px; }
.product-list-progress { font-size: 13px; color: var(--color-text-muted, #64748b); min-height: 20px; }
.product-margin-kpi:disabled { cursor: default; opacity: .8; }

/* Reserve action slots so selecting the first value does not move controls. */
.filter-draft-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; min-height: 36px; }
.filter-draft-actions > small { flex: 1 1 280px; color: var(--color-text-secondary); }
.product-filter-apply { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.product-filter-apply .filter-draft-actions { flex: 1; margin-top: 0; }
.stable-read-content { min-width: 0; position: relative; }
.stable-read-body { display: flow-root; min-width: 0; }
.stable-read-content[data-retained-read="true"] .stable-read-body { pointer-events: none; }
.stable-read-notice { position: absolute; z-index: 5; top: 4px; right: 8px; max-width: calc(100% - 16px); padding: 7px 12px; border: 1px solid var(--color-border-default); border-radius: 7px; color: var(--color-text-secondary); background: var(--color-brand-soft); font-size: 12px; pointer-events: none; }
.finance-expense-panel { overflow: visible; }

.product-kind-toggle { flex: 0 0 auto; white-space: nowrap; }
.product-kind-toggle button { height: 34px; font-size: 12px; }
.product-kind-toggle button.active { color: var(--color-brand); font-weight: 600; }
.product-kind-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin: 0 0 16px; }
.product-kind-bar > span { color: var(--color-text-muted); font-size: 12px; }
.product-select-row { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-top: 8px; }
.product-select-row .product-dependent-filters { flex-wrap: wrap; }
.product-combo-expand { flex: 0 0 24px; width: 24px; height: 24px; border: 1px solid var(--color-brand-border); border-radius: 50%; color: var(--color-brand); background: var(--color-brand-soft); font-size: 18px; line-height: 1; }
.product-component-row > td { padding: 0 20px 16px 64px; background: var(--color-surface-subtle, #f8fafc); }
.product-components { padding: 12px 0; }
.product-components > p { margin: 0 0 10px; color: var(--color-text-secondary); font-size: 12px; }
.product-components table { min-width: 1000px; }
.product-kind-note { margin: 0 20px 12px; color: var(--color-text-secondary); font-size: 12px; line-height: 1.7; }
.product-kind-note summary { cursor: pointer; }

/* Keep the existing navigation actions and responsive focus trap in one masthead. */
.app-shell.top-navigation-shell { --sidebar-width: 0px; }
.top-navigation-shell .shell-masthead {
  position: sticky;
  top: 0;
  z-index: var(--z-sidebar);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  background: var(--nav);
  box-shadow: 0 3px 12px #1f2d4410;
}
.top-navigation-shell .workspace { margin-left: 0; min-height: 0; }
.top-navigation-shell .masthead-tools { position: relative; z-index: 3; flex: 0 0 auto; }
.top-navigation-shell .topbar { position: relative; top: auto; min-height: 40px; padding: 0; gap: 10px; border: 0; background: transparent; backdrop-filter: none; }
.top-navigation-shell .topbar-actions { min-width: 0; gap: 8px; }
.top-navigation-shell .title-area { display: contents; }
.top-navigation-shell .shell-page-heading { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.top-navigation-shell .ai-context-button { min-height: 36px; color: #e1e7f0; border-color: #ffffff25; background: #ffffff0c; white-space: nowrap; }
.top-navigation-shell .date-selector { min-width: 146px; color: var(--text); }
.top-navigation-shell .date-selector .searchable-select { min-width: 90px; }
.top-navigation-shell .shell-masthead .date-selector > .stat-period-picker { position: fixed; top: calc(var(--app-sticky-offset) + 8px); right: 18px; width: min(804px, calc(100vw - 36px)); max-height: calc(100dvh - var(--app-sticky-offset) - 24px); overflow: auto; }
.top-navigation-shell .sidebar {
  position: relative;
  inset: auto;
  z-index: 2;
  width: auto;
  min-width: 0;
  flex: 1 1 0;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 16px;
  padding: 0;
  transform: none;
  box-shadow: none;
}
.top-navigation-shell .main-nav { min-width: 0; align-items: center; gap: 8px; }
.top-navigation-shell .sidebar-navigation-scroll { min-width: 0; padding: 3px 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #53637d transparent; }
.top-navigation-shell .sidebar-navigation-scroll::-webkit-scrollbar { display: block; height: 4px; }
.top-navigation-shell .sidebar-navigation-groups { display: flex; flex-wrap: nowrap; gap: 2px; }
.top-navigation-shell .nav-group, .top-navigation-shell .nav-group > ul { display: contents; }
.top-navigation-shell .nav-group > p {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.top-navigation-shell .nav-group > ul > li { flex: 0 0 auto; margin: 0; }
.top-navigation-shell .sidebar-navigation-link { width: auto; min-height: 40px; gap: 6px; padding: 6px; }
.top-navigation-shell .sidebar-navigation-link.active::before { left: 8px; right: 8px; top: auto; bottom: 0; width: auto; height: 2px; }
.top-navigation-shell .nav-icon { width: 24px; height: 24px; flex-basis: 24px; }
.top-navigation-shell .nav-copy b { font-size: 13px; }
.top-navigation-shell .nav-copy small { display: none; }
.top-navigation-shell .sidebar-collapse-button {
  position: static;
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border-color: #ffffff25;
  background: #ffffff0c;
  color: #d8e0ee;
  box-shadow: none;
}
.top-navigation-shell .sidebar-navigation-tooltip { width: 220px; transform: none; }
.shell-account { display: flex; align-items: center; padding-left: 4px; }
.shell-account-avatar { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; color: #385aaa; background: #d9e5ff; font-size: 14px; }
.shell-account-popover { position: fixed; inset: calc(var(--app-sticky-offset) + 6px) 18px auto auto; margin: 0; padding: 6px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: var(--surface); box-shadow: var(--shadow-overlay); }
.shell-account-popover > button { min-width: 112px; min-height: 40px; padding: 8px 14px; border: 0; border-radius: 6px; background: transparent; }
.shell-account-popover > button:hover { background: var(--surface-soft); }
.shell-account-version { display: block; padding: 4px 14px 8px; color: var(--muted); font-size: 12px; line-height: 1.4; white-space: nowrap; }

/* Observe the actual masthead height: tool wrapping and zoom must not cover tabs. */
.top-navigation-shell .module-stage .subnav,
.top-navigation-shell .module-stage .market-section-nav {
  position: sticky;
  top: var(--app-sticky-offset);
  z-index: var(--z-sticky);
  align-self: start;
  background: var(--surface);
  box-shadow: 0 4px 10px #1f2d4410;
}
/* The chat panel is hosted after this tabs-only stage, so it cannot bound sticky. */
.top-navigation-shell .module-stage.module-stage-ai-chat { display: contents; }
.top-navigation-shell .content { max-width: none; }

@media (max-width: 860px) {
  /* The generic small-screen title caption rule must not hide the real menu glyph. */
  .top-navigation-shell .title-area .mobile-menu-button > span { display: inline-block; font-size: 20px; line-height: 1; }
  .top-navigation-shell .shell-masthead { padding: 10px 13px; }
  .top-navigation-shell .masthead-tools { width: 100%; min-width: 0; }
  .top-navigation-shell .sidebar {
    position: fixed;
    z-index: 5;
    inset: 0 0 auto;
    width: 100%;
    display: none;
    max-height: 85dvh;
    overflow-y: auto;
    padding: 72px 18px 18px;
    border-radius: 0 0 16px 16px;
  }
  .top-navigation-shell .sidebar.mobile-open { display: flex; flex-direction: column; align-items: stretch; gap: 18px; }
  .top-navigation-shell .main-nav { flex: 0 0 auto; }
  .top-navigation-shell .sidebar-navigation-scroll { overflow: visible; }
  .top-navigation-shell .sidebar-navigation-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top-navigation-shell .sidebar .nav-copy { display: flex; }
  .top-navigation-shell .sidebar .sidebar-navigation-link { justify-content: flex-start; min-height: 44px; }
  .top-navigation-shell .sidebar-collapse-button { display: none; }
  .top-navigation-shell .topbar { align-items: flex-start; }
  .top-navigation-shell .topbar-actions { flex: 1 1 auto; flex-wrap: wrap; justify-content: flex-end; }
  .top-navigation-shell .mobile-overlay { z-index: 4; }
}

.import-monitor { min-width: 0; display: grid; gap: 16px; font-size: 14px; }

.import-rule-dialog { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(660px, 100vw); height: 100dvh; max-height: 100dvh; max-width: 100vw; border: 0; padding: 0; background: var(--card); color: var(--ink); box-shadow: -12px 0 50px #152d4926; }

.import-rule-dialog a { text-decoration: none; font-size: 14px; }

  .import-rule-dialog header, .import-rule-dialog footer { padding: 18px; }
  .import-rule-dialog-body { padding-inline: 18px; }
