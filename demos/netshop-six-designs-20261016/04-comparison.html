.v3-layout,.v4-layout{display:grid;gap:16px;min-width:0}
.v3-layout>*,.v4-layout>*,.v3-workspace>*,.v3-focus>*,.v4-analysis>*{min-width:0}
.v3-summary,.v4-summary{min-width:0}
.v3-workspace{display:grid;grid-template-columns:minmax(0,26fr) minmax(0,74fr);gap:18px;align-items:start;min-width:0}
.v3-objects{position:sticky;top:16px;min-width:0}
.v3-objects>.panel{overflow:hidden}
.v3-objects button{max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:left}
.v3-focus{display:grid;gap:14px;min-width:0;padding-left:18px;border-left:1px solid #dce4ee}
.v3-detail{min-width:0}
.v3-detail>.panel{border-top:3px solid #5279ad;box-shadow:0 5px 18px rgba(30,58,95,.045)}
.v3-trend,.v3-observations,.v3-ledger,.v3-footnote{min-width:0}
.v3-trend>.panel{background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%)}
.v3-ledger{padding-top:2px}
.v3-ledger>.panel{border-color:#d4deeb}
.v3-footnote:empty,.v3-observations:empty,.v4-footnote:empty,.v4-observations:empty{display:none}
.v4-comparison{min-width:0;position:relative}
.v4-comparison>.panel{border-top:3px solid #456da1;box-shadow:0 5px 20px rgba(35,60,92,.05)}
.v4-comparison table{font-variant-numeric:tabular-nums}
.v4-comparison thead th{background:#f3f6fb}
.v4-comparison tbody tr:nth-child(even){background:#fafbfd}
.v4-comparison td,.v4-comparison th{vertical-align:middle}
.v4-summary .kpi-strip{gap:10px}
.v4-analysis{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:16px;align-items:stretch;min-width:0}
.v4-trend,.v4-structure{min-width:0;display:grid;align-content:stretch}
.v4-trend>.panel,.v4-structure>.panel{height:100%;min-width:0;box-sizing:border-box}
.v4-structure>.panel{background:linear-gradient(135deg,#fff,#f7f9fc)}
.v4-observations,.v4-ledger,.v4-footnote{min-width:0}
.v4-ledger>.panel{border-top:2px solid #d7e1ee}
@media(max-width:1100px){
 .v3-workspace{grid-template-columns:minmax(0,29fr) minmax(0,71fr);gap:14px}
 .v3-focus{padding-left:14px}
 .v4-analysis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:899px){
 .v3-layout,.v4-layout{gap:12px}
 .v3-workspace,.v4-analysis{grid-template-columns:minmax(0,1fr);gap:12px}
 .v3-objects{position:static}
 .v3-focus{padding-left:0;border-left:0;gap:12px}
 .v4-trend>.panel,.v4-structure>.panel{height:auto}
}
@media(max-width:520px){
 .v3-layout,.v4-layout{gap:10px}
 .v3-workspace,.v3-focus,.v4-analysis{gap:10px}
 .v3-detail>.panel,.v4-comparison>.panel{border-top-width:2px}
}

.v5-layout,.v6-layout,.v5-layout *,.v6-layout *{box-sizing:border-box;min-width:0}
.v5-layout,.v6-layout{--review-line:var(--border,#e3e8ef);--review-ink:var(--text,#1e293b);--review-muted:var(--muted,#64748b);--review-accent:var(--primary,#2563eb);color:var(--review-ink)}
.v5-heading,.v6-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.v5-heading h2,.v6-heading h2{margin:7px 0 0;font-size:25px;letter-spacing:-.5px;line-height:1.3}
.v5-heading>p,.v6-heading>p{max-width:360px;margin:0;line-height:1.7}
.v5-eyebrow,.v6-eyebrow{font-size:11px;font-weight:650;letter-spacing:1.1px;color:var(--review-muted)}
.v5-workspace{display:grid;grid-template-columns:minmax(280px,.34fr) minmax(0,1fr);gap:20px;align-items:start}
.v5-evidence,.v5-main{display:flex;flex-direction:column;gap:18px}
.v5-evidence{position:sticky;top:18px}
.v5-layout .panel,.v6-layout .panel{margin:0}
.v5-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.v5-section-head h3{font-size:15px;font-weight:650;margin:0;line-height:1.45}
.v5-section-head p{margin:6px 0 0;line-height:1.6}
.v5-section-head>.small-muted{font-size:11px;text-align:right}
.v5-diagnostic{border-top:3px solid var(--review-accent)!important;background:linear-gradient(135deg,#f7faff 0%,#fff 65%)}
.v5-diagnostic>.v5-section-head{justify-content:flex-start;align-items:flex-start}
.v5-mark{display:block;width:9px;height:9px;flex:0 0 9px;margin-top:7px;background:var(--review-accent);border-radius:50%;box-shadow:0 0 0 4px #e8efff}
.v5-insights{display:flex;flex-direction:column;gap:11px}
.v5-insights>*{width:100%;margin:0!important}
.v5-result{overflow:hidden}
.v5-result .kpi-strip{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.v5-text-link{font-size:12px;color:var(--review-accent);text-decoration:none;white-space:nowrap}
.v5-text-link:hover{text-decoration:underline}

function infoPanel(d){let mapped=d.rows.filter(r=>r.erp!=='—').length;return `<section class="panel"><div class="panel-head"><div><h2>资料完整性与维护</h2><p>当前商品资料与区间经营值分开查看</p></div><span class="badge">主数据</span></div><div class="record-grid"><div><span>ERP映射</span><b>${mapped} / ${d.rows.length}</b></div><div><span>规格参数</span><b>长 / 宽 / 高 / 重量</b></div><div><span>价格字段</span><b>采购 / 京东 / 到手</b></div></div><div class="detail-note">缺失映射保留—；不根据商品名称猜测ERP货品。展开商品行查看完整字段，列设置可选择资料和经营指标。</div><button style="margin-top:16px" data-action="columns">选择维护字段 →</button></section>`;}
function layout1(p){return `<div class="overview-blocks">${p.kpis}<div class="two-col">${p.chart}<section class="panel"><div class="panel-head"><h2>经营观察</h2><span class="badge gray">先核对，再判断</span></div>${p.insights}</section></div>${p.table}<div class="equal-col">${p.structure}${p.compare}</div>${p.notes}</div>`;}
function layout2(p){return `<div class="stack dense">${p.kpis}<div class="dense-top"><b>经营扫描</b><span>${descriptions[state.module]} 所有明细可搜索、排序和行内展开。</span><button class="text-btn" data-action="issue">只看关注 →</button></div>${p.table}<details class="panel dense-trend"><summary>展开趋势与比较，明细保持当前位置</summary><div class="equal-col">${p.chart}${p.compare}</div></details><div class="equal-col">${p.structure}${p.insights}</div>${p.notes}</div>`;}
function configPage(){let isAdjust=state.module==='adjust';let groups=isAdjust?['授权账户','闸门与数据同步','托管配置','保本口径','方案参数']:tabs.config;let ix=isAdjust?Number(state.configDraft.adjustGroup||0):state.tab,name=groups[ix],draft=state.configDraft[name]||{};let fields=name==='保本口径'?['商品到手价（元）','货品成本（元）','边际保本 ROI','账户目标 ROI']:name==='托管配置'?['词级动作上限 / 天','计划级动作上限 / 天','新建计划上限 / 天','账户日预算合计上限（元）']:name==='统计时效'?['统计订单时效（小时）','订单归因时效（小时）']:name==='异常数据剔除'?['商品编码','异常日期','剔除销售额（元）','剔除推广成交额（元）']:name==='客服映射'?['客服名称','客服分组','显示姓名','备注']:name==='客户排除'?['匹配方式','客户账号 / 关键词','备注']:name==='授权账户'?['账户显示名称','对应示例店铺','授权状态（演示）']:['名称 / 分组名','SPU / SKU / 类目成员','备注'];return `<div class="config-layout"><aside class="panel config-menu">${groups.map((g,i)=>`<button data-action="config-group" data-index="${i}" class="${i===ix?'active':''}">${g}</button>`).join('')}</aside><section class="panel"><div class="panel-head"><div><h2>${name}</h2><p>适用范围：${esc(scope())} · 原型本地草稿</p></div><span class="badge gray">方案演示</span></div><div class="config-warning">本页仅在当前文件内演示填写与保存。账户授权、托管启停、同步、剔除及导入均不连接真实业务。空保本字段保留未知。</div><form id="config-form"><div class="form-grid">${fields.map((f,i)=>`<label>${f}<input name="field${i}" value="${esc(draft['field'+i]||'')}" placeholder="${name==='保本口径'&&i<3?'未配置 · 无法判断':i===0?'请输入示例内容':'选填'}"></label>`).join('')}<label>店铺范围<select name="shop"><option>${esc(scope())}</option></select></label></div><div class="form-actions"><button class="primary" type="submit">保存本地草稿</button><button type="button" data-action="reset-draft" data-name="${name}">重置草稿</button><small id="save-status" role="status">本地演示，不影响系统配置</small></div></form><div class="notes">${name==='保本口径'?'边际保本与ROI目标分开；没有完整成本和到手价，不计算保本，不将未知改成0。':name==='统计时效'?'客服询单统计时效与订单归因时效是不同配置；分析页应显示当时采用的配置。':'分组隶属具体店铺，成员可包含SPU/SKU/类目，不跨店混用。正式实现继续使用既有权限与业务校验。'}</div></section></div>`;}
function special(d){let m=state.module,t=state.tab;if(m==='adjust'&&[2,3].includes(t)){return `${kpis(d)}<div class="equal-col"><section class="panel"><div class="panel-head"><h2>${t===2?'智能托管 · 运行时间线':'计划建设 · 方案库'}</h2><span class="badge gray">${t===2?'未开启':'0 个方案'}</span></div><div class="empty"><b>${t===2?'还没有运行可看':'暂无计划方案'}</b>${t===2?'待确认调整0件，否词工单0件。异常信号与待处理数量分开。':'这里可以预览方案结构，生成与下发需要真实业务能力接入。'}<br><button data-action="local-preview" style="margin-top:15px">${t===2?'查看托管配置草稿':'查看方案结构示例'}</button></div></section>${detail(d)}</div><div class="notes">${esc(d.note)}</div>`;}
 if(m==='cs'&&t===1)return `<div class="panel"><div class="panel-head"><h2>聊天分析 · 标注覆盖</h2><span class="badge warn">暂无标注结果</span></div><div class="empty"><b>先看覆盖，再读结论</b>不转化原因、咨询意图、问题类型、首次解决率显示—。<br>当前示例不调用模型，不发起真实标注。</div><button data-action="local-preview">查看分析结构示例</button></div>`;
 if(m==='selfop'&&t===1)return `${kpis(d)}${table(d)}<div class="notes">${esc(d.note)}</div>`;return null;
}
function render(){let m=state.module;document.title=`${String(VARIANT).padStart(2,'0')} ${designNames[VARIANT-1]} · 网店分析`;$('#app').innerHTML=`<header class="masthead"><div class="brand"><span class="brand-mark">T</span>TERUISI</div><nav class="main-nav" aria-label="主导航">${['AI 对话','运营事务','自动化中心','BI 看板','网店分析','市场分析','客服分析','销售分析','库存管理','商品经营','数据导入','系统设置'].map(x=>`<span class="${x==='网店分析'?'active':''}">${x}</span>`).join('')}</nav><div class="avatar">运</div></header><main class="workspace"><div class="design-line"><div class="design-caption"><span class="design-number">0${VARIANT}</span><b>${designNames[VARIANT-1]}</b><span class="explanation">${designDescriptions[VARIANT-1]}</span></div><nav class="design-links" aria-label="切换设计方案">${files.map((f,i)=>`<a href="${f}#${state.module}:${state.tab}" title="${designNames[i]}" class="${VARIANT===i+1?'active':''}">0${i+1}</a>`).join('')}</nav></div><div class="page-heading"><div><div class="eyebrow">ONLINE STORE ANALYTICS</div><h1>${modules.find(x=>x[0]===m)[1]}<span style="color:#c6d2c9;font-weight:300;margin:0 10px">/</span><span style="font-weight:450">${tabs[m][state.tab]}</span></h1><p class="heading-desc">${descriptions[m]}</p></div><button class="primary" data-action="dictionary">指标口径与来源 ↗</button></div><nav class="nav-strip" role="tablist" aria-label="网店分析子栏目">${modules.map(([key,label])=>`<button role="tab" aria-selected="${m===key}" class="${m===key?'active':''}" data-action="module" data-value="${key}">${label}</button>`).join('')}</nav><div class="toolbar"><div class="filters"><label>${m==='adjust'?'投放账户':'店铺'}<select id="shop-select" ${['b2b','selfop','promotion','adjust'].includes(m)?'disabled':''}>${['全部示例京东店铺',...shops].map((name,i)=>`<option value="${i===0?'all':i-1}" ${shopFor()===(i===0?'all':String(i-1))?'selected':''}>${name}</option>`).join('')}</select></label>${m==='config'?'':`<div class="segmented" aria-label="时间范围"><button data-action="days" data-value="7" class="${state.days===7?'active':''}">近7天</button><button data-action="days" data-value="30" class="${state.days===30?'active':''}">近30天</button><button data-action="custom" class="${![7,30].includes(state.days)?'active':''}">自定义</button></div><span class="small-muted">${state.start.slice(5)} — ${state.end.slice(5)}</span>`}</div><select class="state-control" aria-label="查看演示状态" id="state-mode">${['正常','无数据','加载失败','权限不足'].map(s=>`<option ${state.mode===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="scope-line"><span class="dot"></span><span>合成演示数据 · 截止 2026-10-15</span><span>· ${esc(sourceFor())}指标参考</span>${['b2b','selfop'].includes(m)?'<span class="badge gray">仅自营店</span>':''}<span style="margin-left:auto">金额：人民币元 / 万元</span></div><nav class="subtabs" role="tablist" aria-label="${labels[m]}页签">${tabs[m].map((label,i)=>`<button role="tab" class="${state.tab===i?'active':''}" aria-selected="${state.tab===i}" data-action="tab" data-index="${i}">${label}</button>`).join('')}</nav><div id="content"></div><footer class="page-footer"><span>TERUISI · 设计候选 0${VARIANT}　所有数值为合成示例，非当前经营结论。</span><span>参考站指标 + 本系统导航与主题 · 离线单文件 · 2026.10.16</span></footer></main>`;renderContent();}
function renderContent(){let d=dataset(),el=$('#content');if(state.mode!=='正常'){el.innerHTML=`<section class="panel empty"><b>${state.mode==='权限不足'?'没有当前范围的查看权限':state.mode==='加载失败'?'暂时无法读取数据':'当前范围暂无数据'}</b>${state.mode==='权限不足'?'不展示受限范围的记录与汇总。':'保留店铺、时间和栏目；不会把缺失显示成0。'}<br><button style="margin-top:15px" data-action="retry">恢复正常演示</button></section>`;return;}
 if(state.module==='config'||state.module==='adjust'&&state.tab===5){el.innerHTML=configPage();return;}let s=special(d);if(s){el.innerHTML=s;return;}let p={kpis:kpis(d),chart:state.module==='info'?infoPanel(d):chart(d),insights:insightItems(d),table:table(d),objects:objects(d),detail:detail(d),compare:compare(d),notes:`<div class="notes">口径说明 · ${esc(d.note)}</div>`,sectionTitle:labels[state.module],structure:structure(d)};el.innerHTML=[layout1,layout2,layout3,layout4,layout5,layout6][VARIANT-1](p);}
function openDialog(title,body){let dialog=$('#dialog');$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;dialog.showModal();}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3000);}
function changeTab(t){state.tab=t;state.selected=0;state.expanded=null;state.cols=null;state.page=1;state.query='';state.onlyIssue=false;try{history.replaceState(null,'','#'+state.module+':'+state.tab);}catch{location.hash=state.module+':'+state.tab;}render();}
document.addEventListener('click',e=>{let target=e.target.closest('[data-action]');if(!target)return;let a=target.dataset.action,d=dataset(),i=Number(target.dataset.index||0);
 if(a==='module'){state.module=target.dataset.value;if(['promotion','adjust'].includes(state.module))state.shop='0';changeTab(0);return;}if(a==='tab'){changeTab(i);return;}if(a==='close'){$('#dialog').close();return;}
 if(a==='days'){state.days=Number(target.dataset.value);state.end='2026-10-15';state.start=state.days===7?'2026-10-09':'2026-09-16';state.page=1;state.selected=0;render();return;}
 if(a==='custom'){openDialog('自定义演示周期',`<form id="date-form"><div class="form-grid"><label>开始日期<input name="start" type="date" value="${state.start}" min="2026-01-01" max="2026-10-15" required></label><label>结束日期<input name="end" type="date" value="${state.end}" min="2026-01-01" max="2026-10-15" required></label></div><p class="small-muted" style="margin-top:15px">合成数据按天数缩放，仅演示筛选联动，不查询真实历史。</p><div class="form-actions"><button class="primary">应用周期</button><span id="date-error" role="alert"></span></div></form>`);return;}
 if(a==='sort'){state.sort=!state.sort;renderContent();return;}if(a==='expand'){state.expanded=state.expanded===target.dataset.id?null:target.dataset.id;renderContent();return;}if(a==='object'){state.selected=i;renderContent();return;}if(a==='group'){state.group=target.dataset.value;state.cols=null;renderContent();return;}if(a==='page'){state.page+=Number(target.dataset.value);renderContent();return;}if(a==='clear-query'){state.query='';state.page=1;renderContent();return;}if(a==='clear-issue'){state.onlyIssue=false;state.page=1;renderContent();return;}
 if(a==='evidence'&&i>0){openDialog('指标依据与口径',`<p>${esc(d.note)}</p><div class="notes">${esc(sourceFor())}指标参考 · ${esc(scope())} · 合成示例</div>`);return;}if(a==='issue'||a==='evidence'){state.onlyIssue=true;state.page=1;renderContent();$('#data-detail')?.scrollIntoView({block:'center',behavior:'smooth'});toast('已筛选关注记录，保留当前店铺与周期');return;}
 if(a==='point'){let tip=target.closest('.chart-card').querySelector('.chart-tip');tip.textContent=`已选第${i+1}段 · 合成值 ${target.dataset.value} · ${state.start} 至 ${state.end}`;return;}
 if(a==='metric'){let m=d.metrics[i];openDialog(m.label,`<p>本期：<b>${fmt(m.value,m.type)}</b>　基期：${fmt(m.prior,m.type)}</p><p style="margin-top:12px">${esc(m.note||d.note)}</p><div class="notes">${esc(sourceFor())}指标参考 · ${esc(scope())}<br>${state.start} — ${state.end}<br>所有数值来自合成演示，不是实时系统查询。</div>`);return;}
 if(a==='columns'){let selected=visibleCols(d).map(c=>c.key);openDialog('明细列设置',`<p class="small-muted">对象身份和展开操作固定保留；至少选择一项指标。</p><form id="columns-form"><div class="form-grid" style="margin-top:20px">${d.cols.map(c=>`<label style="display:flex;align-items:center;gap:8px"><input style="width:auto;min-height:0" type="checkbox" name="col" value="${c.key}" ${selected.includes(c.key)?'checked':''}>${esc(c.label)}</label>`).join('')}</div><div class="form-actions"><button class="primary">应用列设置</button><span id="col-error" role="alert"></span></div></form>`);return;}
 if(a==='export'){let rows=filtered(d),cols=d.cols,quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let csv='\ufeff'+[['合成示例对象',...cols.map(c=>c.label)],...rows.map(r=>[r.name,...cols.map(c=>r[c.key])])].map(r=>r.map(quote).join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='网店分析-合成示例.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选的合成示例');return;}
 if(a==='dictionary'){openDialog('指标口径与参考来源',`<p><b>已核对参考站9个主栏目。</b>此文件保留主要指标和典型明细字段，完整业务能力仍以正式系统为准。</p><h3>当前栏目</h3><p>${esc(d.note||descriptions[state.module])}</p><h3>当前指标</h3><div class="record-grid">${d.metrics.map(m=>`<div><span>${esc(m.label)}</span><b>${fmt(m.value,m.type)}</b></div>`).join('')}</div><h3>统一边界</h3><p>平台成交、ERP净销售、广告归因成交各自独立。ROI为归因成交/花费；访客累计不当区间去重UV；比率差值使用百分点。缺口、无权限、空记录与0分别展示。</p><h3>指标参考</h3><p><a href="http://10.0.8.49/netshop/promo_adjust" target="_blank" rel="noopener">特睿思网店分析</a> · 2026-10-16只读核对。页面不嵌入该站任何账号、明细或客户信息。</p><div class="notes">合成演示 · 未连接业务API · 单文件离线打开</div>`);return;}
 if(a==='config-group'){if(state.module==='adjust'){state.configDraft.adjustGroup=i;renderContent();}else changeTab(i);return;}if(a==='reset-draft'){delete state.configDraft[target.dataset.name];renderContent();return;}
 if(a==='local-preview'){openDialog('本地结构示例',`<div class="record-grid"><div><span>输入范围</span><b>店铺 / 计划 / 日期</b></div><div><span>判断依据</span><b>成熟ROI / 成本覆盖</b></div><div><span>动作结构</span><b>建议 / 原因 / 复盘</b></div></div><p style="margin-top:20px">这里只展示页面结构，不生成真实方案，不启动托管，不调用模型或发送调整。</p>`);return;}if(a==='retry'){state.mode='正常';render();}
});
document.addEventListener('keydown',e=>{if(e.target.id==='table-query'&&e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();state.query=e.target.value.trim();state.page=1;renderContent();}if(e.target.matches('circle[data-action]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{if(e.target.id==='shop-select'){state.shop=e.target.value;state.page=1;state.selected=0;state.expanded=null;render();}if(e.target.id==='state-mode'){state.mode=e.target.value;renderContent();}});
document.addEventListener('submit',e=>{e.preventDefault();let form=e.target;
 if(form.id==='date-form'){let f=new FormData(form),start=f.get('start'),end=f.get('end');if(!start||!end||start>end||end>'2026-10-15'){$('#date-error').textContent='日期范围无效，请选择截止10月15日的有效范围。';return;}state.start=start;state.end=end;state.days=Math.round((Date.parse(end)-Date.parse(start))/86400000)+1;state.page=1;$('#dialog').close();render();}
 if(form.id==='columns-form'){let cols=new FormData(form).getAll('col');if(!cols.length){$('#col-error').textContent='至少保留一项指标';return;}state.cols=cols;$('#dialog').close();renderContent();}
 if(form.id==='config-form'){let groups=state.module==='adjust'?['授权账户','闸门与数据同步','托管配置','保本口径','方案参数']:tabs.config;let ix=state.module==='adjust'?Number(state.configDraft.adjustGroup||0):state.tab;state.configDraft[groups[ix]]=Object.fromEntries(new FormData(form));$('#save-status').textContent='本地草稿已保存 · 仅当前文件会话有效';toast('本地草稿已保存，未写入正式系统');}
});
try{let [m,t]=location.hash.slice(1).split(':');if(modules.some(x=>x[0]===m)){state.module=m;state.tab=Math.max(0,Math.min(tabs[m].length-1,Number(t)||0));if(['promotion','adjust'].includes(m))state.shop='0';}}catch{}render();
